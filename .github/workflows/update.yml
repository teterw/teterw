name: Update profile cards

on:
  schedule:
    - cron: "*/30 * * * *"
    # Extra daily refresh just after midnight in Thailand (17:07 UTC), in case
    # GitHub skips some of the 30-minute runs, which it does when it's busy.
    - cron: "7 17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [assets/make_svgs.py, .github/workflows/update.yml]

concurrency:
  group: update-cards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Redraw cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LASTFM_USER: ${{ vars.LASTFM_USER }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python assets/make_svgs.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg assets/*.json README.md
          git diff --cached --quiet || git commit -m "Update profile cards"
          git push
